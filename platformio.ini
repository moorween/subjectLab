; subjectLab — библиотека и тестовый стенд для неё.
; Этот файл нужен только для сборки самотеста (examples/selftest) на ESP32;
; проекты, которые подключают библиотеку через lib_deps, его не используют.
; Периферия не нужна. Пины GPIO27 и GPIO33 должны быть свободны.

[platformio]
src_dir = examples/selftest

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nodemcu-32s
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -Wall -Wno-unused-variable
; сама библиотека из корня этого репозитория
lib_deps = symlink://.
